[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herhim"
version = "0.1.0"
description = "Two complete AI-companion personality catalogues with a deterministic, explainable affect engine and mood-driven multilingual voice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gravion-ux" }]
keywords = [
    "ai-companion",
    "character-card",
    "affect",
    "personality",
    "tts",
    "roleplay",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "codespell==2.4.1",
    "mypy==1.18.2",
    "pytest==9.2.0",
    "pytest-cov==7.0.0",
    "ruff==0.17.4",
]
voice = [
    "kokoro>=0.9",
    "piper-tts>=1.2",
]

[project.scripts]
herhim = "herhim.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/Her--Him"
Repository = "https://github.com/gravion-ux/Her--Him"
Issues = "https://github.com/gravion-ux/Her--Him/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
herhim = [
    "data/her/*.json",
    "data/him/*.json",
    "data/samples/*.json",
    "data/samples/*.wav",
    "data/samples/*.mp3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["herhim"]

[[tool.mypy.overrides]]
module = ["herhim.data.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that take more than a second",
]

[tool.coverage.run]
branch = true
source = ["herhim"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.codespell]
skip = ".git,*.lock,*.onnx,*.wav,*.mp3,uv.lock"
ignore-words-list = "ba,nd,te,fo"
