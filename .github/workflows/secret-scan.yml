name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: TruffleHog walks the commit graph, and the
          # action resolves the push's before/after SHAs against the clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fast, deterministic gate for hardcoded credentials in tracked files.
      - name: Scan repository for hardcoded secrets
        run: python scripts/scan-secrets.py

      # Deep scan of the full commit history for verified, leaked credentials.
      # No `base`/`head` inputs: the action derives the commit range from the
      # push or pull-request event, which also covers a repository's first push
      # (where there is no parent commit to diff against).
      - name: Scan with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified
