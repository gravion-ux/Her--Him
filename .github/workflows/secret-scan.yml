name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: main
          head: HEAD
          extra_args: --only-verified --fail

      - name: Scan with git-secrets
        run: |
          # Check for common patterns
          if git log -r HEAD~1..HEAD --pretty=format:"%H" | xargs -I {} git show {} | grep -iE "(password|secret|token|api_key|apikey|private_key)" \>/dev/null 2>\&1; then
            echo "Potential secrets found in recent commits"
            exit 1
          fi